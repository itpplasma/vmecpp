name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy
# validation, and allow manual testing through the repository's "Actions" tab.
on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        types: [opened, synchronize, reopened, labeled]
        paths:
            - .github/workflows/copilot-setup-steps.yml
    merge_group:

# CI-only dependency workaround, see .github/constraints.txt
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        if: >-
          github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Install system dependencies (Ubuntu)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      cmake \
                      zlib1g-dev \
                      libomp-dev \
                      python3-dev

            - name: Install vmecpp with test dependencies
              run: |
                  pip install pre-commit
                  pre-commit install
                  pip install -e .[test]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
