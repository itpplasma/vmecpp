name: C++ TSAN tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
      - production
  workflow_dispatch:
  merge_group:

# Cancel currently running job if a new one comes along for the same branch or tag.
# From https://stackoverflow.com/a/72408109.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  tsan:
    name: Build and run tsan tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # for the mgrid test data
      # The TSAN image (clang/libomp with ThreadSanitizer support) takes ~1h to
      # build, so it is prebuilt and pushed to GHCR by build_tsan_image.yaml and
      # only rebuilt when src/vmecpp/cpp/docker/tsan/ changes. Here we just pull
      # the cached image.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull TSAN Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/vmecpp-tsan:latest
          docker pull "${IMAGE,,}"
          docker tag "${IMAGE,,}" proximafusion/tsan
      - name: Add the BIEST SDK to the existing TSAN image
        run: |
          docker run --name vmecpp-tsan-sdk --user 0 proximafusion/tsan \
            bash -c "apt-get update && apt-get install -y libmkl-full-dev"
          docker commit vmecpp-tsan-sdk proximafusion/tsan
          docker rm vmecpp-tsan-sdk
      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: "~/.cache/bazel"
          key: bazel-tsan-${{ github.sha }}
          restore-keys: bazel-tsan
      - name: Run TSAN tests in Docker
        run: |
          mkdir -p ~/.cache/bazel
          docker run --rm \
            -v ${{ github.workspace }}:/vmecpp \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e USER=root \
            -v ~/.cache:/tmp/home/.cache \
            proximafusion/tsan \
            bash -c "cd /vmecpp/src/vmecpp/cpp && bazel test --config=tsan_archer_in_docker --jobs=1 --test_output=errors -- //vmecpp/... -//vmecpp/vmec/pybind11/..."
      # Entries are immutable: a new key per main commit refreshes the cache, GitHub evicts old ones.
      - name: Save bazel cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: "~/.cache/bazel"
          key: bazel-tsan-${{ github.sha }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
