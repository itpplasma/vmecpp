name: V&V against reference VMEC

# Runs the Verification & Validation suite from proximafusion/vmecpp-validation
# against reference Fortran VMEC2000, using the vmecpp version built from this
# commit rather than the version pinned on PyPI/GitHub.
#
# - On every push to main: a short run (a handful of configs, a few minutes)
#   so regressions are caught immediately.
# - On release and on manual request: the full run (all ~219 configurations,
#   ~8h serially), split across eight shards with a three-hour budget each.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  full-validation-result:
    name: Full V&V result
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    needs: validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: vnv-*-*
          path: validation-coverage
      - name: Verify every configuration was validated exactly once
        run: python .github/scripts/validation_shards.py check validation-coverage 8
      - name: Require every shard to pass
        if: always()
        env:
          SHARD_RESULT: ${{ needs.validation.result }}
        run: test "$SHARD_RESULT" = success

  validation:
    name: ${{ github.event_name == 'push' && 'Run VMEC++ validation' || format('Full validation shard {0}', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '["short"]' || '[0,1,2,3,4,5,6,7]') }}
    runs-on: ubuntu-22.04
    # Eight round-robin shards target <=3h each instead of ~8h serially.
    # Keep the short push run's existing budget.
    timeout-minutes: ${{ github.event_name == 'push' && 360 || 180 }}
    steps:
      - name: Check out VMEC++
        uses: actions/checkout@v4
        with:
          path: vmecpp
          lfs: true

      - name: Check out vmecpp-validation
        uses: actions/checkout@v4
        with:
          repository: proximafusion/vmecpp-validation
          # Match this solver's VMEC 8.52 chipf and half-grid bsubsmns outputs.
          # Later validation revisions assume upstream's newer output conventions.
          ref: 4017e53095c09e2ead20c6bb64c12796583520c5
          path: vmecpp-validation
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install required system packages for Ubuntu
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake libnetcdf-dev libopenmpi-dev \
            libomp-dev libeigen3-dev nlohmann-json3-dev libhdf5-dev

      - name: Install vmecpp-validation's Python requirements
        run: |
          cd vmecpp-validation
          # Install everything except vmecpp itself: we build and install vmecpp
          # from this commit below instead of the version pinned in requirements.txt.
          grep -v '^vmecpp@' requirements.txt > requirements.no-vmecpp.txt
          python -m pip install -r requirements.no-vmecpp.txt

      - name: Prepare full validation shard
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: vmecpp-validation
        run: python ../vmecpp/.github/scripts/validation_shards.py prepare ${{ matrix.shard }} 8

      - name: Upload shard manifest before validation
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vnv-manifest-${{ matrix.shard }}
          path: vmecpp-validation/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Install VMEC++ from this commit
        run: python -m pip install ./vmecpp "numpy<2.1"

      - name: Run short validation
        if: github.event_name == 'push'
        working-directory: vmecpp-validation
        run: python validate_vmec.py --short

      - name: Run full validation
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        working-directory: vmecpp-validation
        run: python ../vmecpp/.github/scripts/validation_shards.py run ${{ matrix.shard }} 8

      - name: Upload shard check summary
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: vnv-summary-${{ matrix.shard }}
          path: vmecpp-validation/vnvresults_*/all_vnv_checks.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload V&V results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'vnvresults' || format('vnvresults-{0}', matrix.shard) }}
          path: vmecpp-validation/vnvresults_*/
          retention-days: 30

  free-boundary-quasr:
    name: Run QUASR free-boundary tests
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
      - name: Install required packages for Ubuntu
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake libnetcdf-dev libopenmpi-dev \
            libomp-dev libeigen3-dev nlohmann-json3-dev libhdf5-dev
      - name: Install package
        run: python -m pip install -v ".[test]"
      - name: Run slow QUASR free-boundary tests
        run: python -m pytest -m slow tests/test_free_boundary_quasr.py -v -ra
      - name: Upload QUASR free-boundary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quasr-free-boundary-out
          path: quasr_free_boundary_out/
          retention-days: 30
