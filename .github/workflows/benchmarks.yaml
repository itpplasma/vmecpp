name: Benchmarks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared environment + run; PR runs compare and comment but never write
      # back (auto-push stays false).
      - name: Run benchmarks
        uses: ./.github/actions/run-benchmarks
        with:
          auto-push: "false"
          comment-on-alert: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
